[package]
name = "jarvis"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Mission control for herdr: animated big-picture core, projects by path, threads, timeline and token usage."
repository = "https://github.com/NexorPL/herdr-jarvis"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
